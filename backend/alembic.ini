# Alembic config. Note what is NOT here: a database URL.
#
# `sqlalchemy.url` is deliberately absent. env.py reads the URL from app.config so there is
# exactly one place that knows how to reach Postgres, and so a checked-in file can never point
# a production `alembic upgrade head` at the wrong database. Override for one command with:
#   uv run alembic -x url=postgresql+asyncpg://... upgrade head

[alembic]
script_location = %(here)s/migrations
# Prepend backend/ so `import app` works when alembic runs from this directory.
prepend_sys_path = .
path_separator = os

[post_write_hooks]
# Autogenerated migrations go through ruff, so a generated file never fails CI lint.
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
