[project]
name = "penny-backend"
version = "0.1.0"
description = "Penny backend API"
# 3.12: PEP 695 generics and StrEnum are used downstream.
requires-python = ">=3.12"
# Every dependency the project will need is pre-added here so no downstream
# branch has to touch this manifest (lockfile conflicts are regenerations, not merges).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Production server: uvicorn alone cannot dual-stack bind on Railway.
    "gunicorn>=23",
    # >=2.0: 1.x could resolve to a version predating the Responses API.
    "openai>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.30",
    "alembic>=1.13",
    # argon2 password hashing; passlib is unmaintained.
    "pwdlib[argon2]>=0.2",
    # Signs the session cookie carrying household_id.
    "itsdangerous>=2.2",
    # Multipart form parsing for the .txt export upload.
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    # zoneinfo has no tz database inside a slim container image.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "hypothesis>=6",
    "anyio>=4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits real external APIs; costs money, skipped unless opted in",
    "db: requires PENNY_TEST_DATABASE_URL; skipped when unset",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    # FastAPI's Depends()/Query() defaults are function calls by design.
    "B008",
    # ClassVar annotations on pydantic/SQLAlchemy model attributes are noise.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert freely and pin long literal payloads inline.
"tests/**" = ["S101", "E501"]
"fixtures/**" = ["E501"]
# Alembic writes these; don't fight the generator.
"migrations/versions/*" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
